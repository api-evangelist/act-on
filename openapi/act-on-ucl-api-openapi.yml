        required: true
        schema:
          type: string
          enum:
          - EMAIL
          - EXTERNAL_ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actonPrimaryScore:
                  type: string
                  description: The contact's Act-On primary score
                businessCity:
                  type: string
                  description: The contact's business city
                businessCountry:
                  type: string
                  description: The contact's business country
                businessFax:
                  type: string
                  description: The contact's business fax number
                businessPhone:
                  type: string
                  description: The contact's business phone number
                businessState:
                  type: string
                  description: The contact's business state
                businessStreet:
                  type: string
                  description: The contact's business street address
                businessWebsite:
                  type: string
                  description: The contact's business website
                businessZip:
                  type: string
                  description: The contact's business zip code
                company:
                  type: string
                  description: The contact's company name
                createdDate:
                  type: string
                  description: The contact's created date
                customFields:
                  type: object
                  description: Custom field data by column index
                  properties: {}
                dateOfBirth:
                  type: string
                  description: The contact's Act-On date of birth in format YYY-MM-DD
                department:
                  type: string
                  description: The contact's department
                email:
                  type: string
                  description: The contact's email address
                externalId:
                  type: string
                  description: The external system id of the contact
                firstName:
                  type: string
                  description: The contact's first name
                homePhone:
                  type: string
                  description: The contact's home phone number
                id:
                  type: string
                  description: The Act-On contacts id of the contact
                lastName:
                  type: string
                  description: The contact's last name
                legacyRecordId:
                  type: string
                  description: The legacy record id of the contact
                middleName:
                  type: string
                  description: The contact's middle name
                mobilePhone:
                  type: string
                  description: The contact's mobile phone number
                objectType:
                  type: string
                  description: The object type of the contact in an external system
                personalCity:
                  type: string
                  description: The contact's personal city
                personalCountry:
                  type: string
                  description: The contact's personal country
                personalState:
                  type: string
                  description: The contact's personal state
                personalStreet:
                  type: string
                  description: The contact's personal street address
                personalWebsite:
                  type: string
                  description: The contact's personal website
                personalZip:
                  type: string
                  description: The contact's personal zip code
                picture:
                  type: string
                  description: A URL to the contact's picture
                timezone:
                  type: string
                  description: The contact's timezone
                title:
                  type: string
                  description: The contact's job title
                updatedDate:
                  type: string
                  description: The contact's updated date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
