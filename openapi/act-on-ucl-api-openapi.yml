openapi: 3.2.0
info:
  title: Act On Ucl API
  version: '2.0'
  description: 'Operations tagged Ucl across 2 of this provider''s published API definitions: act-on-raw-body-api-openapi.yml, act-on-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.actonsoftware.com
security:
- sec0: []
tags:
- name: Ucl
paths:
  /ucl/v2/ucl/v2/{accountId}/import/contacts/{importDefinitionId}:
    servers:
    - url: https://api.actonsoftware.com
    post:
      summary: Import Contacts
      description: Create one or more users for an account. Each user is sent as an element in a JSON array.
      operationId: test-api
      parameters:
      - name: accountId
        in: path
        schema:
          type: integer
          format: int32
        required: true
      - name: importDefinitionId
        in: path
        schema:
          type: integer
          format: int32
        required: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  description: 'JSON object with the following required keys: userType, email, firstName, lastName, password.'
                filter:
                  type: object
                  required:
                  - type
                  - expressionEvaluationType
                  properties:
                    type:
                      type: string
                    expressionEvaluationType:
                      type: string
                      enum:
                      - AND
                      - OR
                      - CUSTOM
                    customBooleanExpression:
                      type: string
                      default: 'NULL'
                    expressions:
                      type: array
                      items:
                        properties:
                          type:
                            type: string
                            enum:
                            - profile
                            - system
                          id:
                            type: string
                          field:
                            type: string
                          condition:
                            type: object
                            properties:
                              type:
                                type: string
                              comparison:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                        type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"success\",\n    \"keyPoint\": \"blank\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  keyPoint:
                    type: string
                    example: blank
        '400':
          description: '400'
          content:
            text/plain:
              examples:
                Result:
                  value: '{boo}'
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --location 'https://api.actonsoftware.com/api/1/user' \\\n--header 'Content-Type: application/json' \\\n--header 'Authorization: Bearer TOKEN_HERE' \\\n--data-raw '[\n    {\n        \"userType\": \"Marketing\",\n        \"email\": \"name3@act-on.net\",\n        \"firstName\": \"fName1\",\n        \"lastName\": \"Surname1\",\n        \"password\": \"pwxxx123\",\n        \"title\": \"Marketing Manager\",\n        \"phoneNumber\": \"111-111-1111\",\n        \"mobileNumber\": \"111-111-1111\",\n        \"faxNumber\": \"111-111-1111\",\n        \"timeZone\": \"PT\",\n        \"sendEmailConfirmation\": \"Y\"\n    }\n]'"
          name: Example 1
        samples-languages:
        - curl
      tags:
      - Ucl
  /ucl/v2/{accountId}/import/contacts/{importDefinitionId}:
    servers:
    - url: https://api.actonsoftware.com
    post:
      summary: Import Contacts
      description: ''
      operationId: import-contacts
      parameters:
      - name: accountId
        in: path
        description: accountId
        schema:
          type: integer
          format: int32
        required: true
      - name: importDefinitionId
        in: path
        description: The id of the import definition
        schema:
          type: integer
          format: int32
        required: true
      - name: cleanupImportDefinition
        in: query
        description: Whether to delete the import definition after the import
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: CSV with contact data matching the provided import definition. Limit of 200MB.
                  format: binary
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Successfully Uploaded:
                  value: "{\n    \"data\": {\n        \"accountId\": \"12345\",\n        \"importId\": \"1longstringhere\",\n        \"importDefinitionId\": 987654,\n        \"importStatus\": \"RUNNING\",\n        \"errorMessage\": null,\n        \"submittedCount\": 0,\n        \"unsubmittedCount\": 0,\n        \"createdCount\": 0,\n        \"updatedCount\": 0,\n        \"failedCount\": 0,\n        \"rejectedCount\": 0\n    }\n}"
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accountId:
                        type: string
                        example: '12345'
                      importId:
                        type: string
                        example: 1longstringhere
                      importDefinitionId:
                        type: integer
                        example: 987654
                        default: 0
                      importStatus:
                        type: string
                        example: RUNNING
                      errorMessage: {}
                      submittedCount:
                        type: integer
                        example: 0
                        default: 0
                      unsubmittedCount:
                        type: integer
                        example: 0
                        default: 0
                      createdCount:
                        type: integer
                        example: 0
                        default: 0
                      updatedCount:
                        type: integer
                        example: 0
                        default: 0
                      failedCount:
                        type: integer
                        example: 0
                        default: 0
                      rejectedCount:
                        type: integer
                        example: 0
                        default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Column Not Found:
                  value: "{\n    \"errors\": [\n        \"CSV Column(s) was not found: MissingColumnName. All csvColumns need to be on the CSV headers prior to import.\"\n    ]\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                      example: 'CSV Column(s) was not found: MissingColumnName. All csvColumns need to be on the CSV headers prior to import.'
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
        '403':
          description: '403'
          content:
            text/plain:
              examples:
                Error processing file:
                  value: ''
        '413':
          description: '413'
          content:
            text/plain:
              examples:
                Result:
                  value: File size exceeds the maximum limit of 200MB.
        '415':
          description: '415'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
        '500':
          description: '500'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Ucl
  /ucl/v2/{accountId}/import/definition:
    servers:
    - url: https://api.actonsoftware.com
    get:
      summary: Get Import Definitions
      description: ''
      operationId: get-import-definitions
      parameters:
