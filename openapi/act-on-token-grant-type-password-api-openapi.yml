openapi: 3.2.0
info:
  title: oauth Token?grant Type=password API
  version: '2.0'
servers:
- url: https://api.actonsoftware.com
security:
- sec0: []
tags:
- name: Token?grant Type=password
paths:
  /token?grant_type=password:
    post:
      summary: Grant-Type Password
      description: Use Username and password to get access token and refresh token
      operationId: Grant-Type Password
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                username:
                  type: string
                  description: Act-On username (email) for the account
                password:
                  type: string
                  description: Act-On password for the username
                client_id:
                  type: string
                  description: Client ID
                client_secret:
                  type: string
                  description: Client Secret
              type: object
              required:
              - username
              - password
              - client_id
              - client_secret
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{  \"access_token\":\"12345678-9abc-defg-hijk-lmnopqrs\",\n   \"refresh_token\":\"12345678-9abc-defg-hijk-lmnopqrs\",\n   \"scope\":\"offline-access\",\n   \"token_type\":\"Bearer\",\n   \"expires_in\": 3600}"
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: 12345678-9abc-defg-hijk-lmnopqrs
                  refresh_token:
                    type: string
                    example: 12345678-9abc-defg-hijk-lmnopqrs
                  scope:
                    type: string
                    example: offline-access
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600
                    default: 0
        '401':
          description: Invalid client_id or client_secret
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: access_denied
                    error_description: Unauthorized
              schema:
                type: object
                properties: {}
        '403':
          description: Invalid username or password
          content:
            application/json:
              examples:
                Result:
                  value:
                    error: invalid_grant
                    error_description: Wrong email or password.
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      tags:
      - Token?grant Type=password
components:
  securitySchemes:
    sec0:
      type: oauth2
      flows: {}
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
x-readme-fauxas: true
