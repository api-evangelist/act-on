note: >-
  Act-On publishes NO MCP server — hosted, remote or stdio. Nothing was found in the
  developer portal, the documentation index (llms.txt, 161 pages), npm, PyPI,
  RubyGems, or any Act-On GitHub org, and no /mcp endpoint was probed or guessed on
  any Act-On host. The tools below are a CANDIDATE grouping DERIVED from the 158
  operations in Act-On's own published OpenAPI documents. Every `rest:` value is a
  real operationId grepped from those specs; nothing here is shipped by Act-On.
  This round upgrades the previous derivation: it was grounded in llms.txt page
  titles, it is now grounded in the contract itself, so each candidate tool inherits
  a real parameter set and request body.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: derived
  checked: '2026-08-13'
  note: >-
    mode:none — nobody ships a server, so there is nothing an agent can reach. If one
    were built it would need the OAuth 2.0 password or authorization_code grant
    against https://api.actonsoftware.com/token, and would have to budget against
    Act-On's published 5-authentication-calls-per-hour ceiling by caching the
    access_token.
