agent_safety_notes:
- >-
  send_message, resend_message and send_transactional_email are irreversible and
  externally visible — they put mail in inboxes. No dry-run or preview mode exists on
  those operations, and no idempotency key is supported anywhere in the contract, so
  a retried send is a second send.
- >-
  delete_list, delete_segment and delete_records destroy customer data with no
  documented soft-delete or undo.
- >-
  update_opt_out_list and set_subscriptions_by_email write consent state. Getting
  these wrong is a compliance event, not a bug.
