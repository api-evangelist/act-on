summary: >-
  Act-On publishes two named tiers on its public pricing page. Professional carries
  a published list price; Enterprise is quote-only. Both are billed on an "Active
  Contacts" model — the customer pays for contacts actually emailed in a period,
  not for total database size — and both require an annual contract. There is no
  free tier and no self-serve credit card checkout; the API is reached through a
  paid account plus a free developer sandbox requested by form.
