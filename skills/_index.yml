cross_cutting_rules:
- Cache the OAuth access_token. Act-On permits 5 authentication calls per hour.
- Budget every flow against 5 requests/second and 30,000 requests/day.
- '{accountId} is a REQUIRED path parameter on /ucl/v2 and /custom-objects/v1; the
  token does not imply it.'
- No Idempotency-Key exists anywhere in Act-On's contract. Never blind-retry a POST
  that sends mail or creates a job.
- No 429 is declared on any operation and no rate-limit headers are returned; count
