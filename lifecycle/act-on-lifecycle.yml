api: Act-On REST API
summary: >-
  Act-On versions in the URI path and runs four differently-versioned surfaces side
  by side. It publishes no deprecation policy, sets no Sunset or Deprecation header,
  and marks not a single operation deprecated across 158 published operations — while
  simultaneously shipping a "legacy" generation (/api/1) alongside its replacement
  (/ucl/v2) with no stated end date for either. A consumer has no published signal
  telling them which surface to build on or when the old one goes away.
