- name: Act-On Custom Objects Service
  description: >-
    Separately versioned (3.4.3) Custom Data service for defining custom object
    schemas and fields, creating datasets, validating and ingesting CSV/JSON data,
    polling ingest jobs, and querying custom data joined against Act-On Contacts
    with offset or cursor pagination. Act-On states these endpoints are in BETA and
    available on request only.
  humanURL: https://developer.act-on.com/reference/overview
  baseURL: https://api.actonsoftware.com/custom-objects
  properties:
  - type: OpenAPI
    url: openapi/act-on-custom-objects-service-openapi.yml
  - type: Documentation
    url: https://developer.act-on.com/reference/overview
  - type: Authentication
    url: authentication/act-on-authentication.yml
  - type: Overlay
    url: overlays/act-on-custom-objects-service-overlay.yaml
- name: Act-On Outgoing Webhooks
  description: >-
    Outgoing webhook event surface — nineteen documented event types across
    contacts, consent, deliverability, lead scoring, subscriptions, automated
    programs, messaging, forms and CRM connections. Payloads are JSON, POSTed to a
    customer-configured endpoint and signed with HMAC SHA-256 using a per-endpoint
    secret. Endpoints are configured in the Act-On UI, not through the REST API.
  humanURL: https://connect.act-on.com/hc/en-us/sections/20585868662935-Outgoing-Incoming-Webhooks
