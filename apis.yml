apis:
- name: Act-On Outgoing Webhooks
  description: >-
    Outgoing webhook event surface — nineteen documented event types across contacts, consent, deliverability,
    lead scoring, subscriptions, automated programs, messaging, forms and CRM connections. Payloads are
    JSON, POSTed to a customer-configured endpoint and signed with HMAC SHA-256 using a per-endpoint secret.
    Endpoints are configured in the Act-On UI, not through the REST API.
  humanURL: https://connect.act-on.com/hc/en-us/sections/20585868662935-Outgoing-Incoming-Webhooks
