name: Act-On
description: >-
  Act-On Software is a cloud-based marketing automation platform used by B2B and
  B2C marketing teams for email marketing, lead generation and nurturing, landing
  pages and forms, website visitor tracking, lead scoring and segmentation, custom
  data, and campaign reporting. Act-On exposes a documented OAuth 2.0 REST API
  (base https://restapi.actonsoftware.com, versioned under /api/1) covering
  contacts and lists, segments, messages and email campaigns, media and creative
  assets, landing pages and forms, subscription management, custom data ingestion,
  and reporting. Added to the API Evangelist network from a Norwest Venture
  Partners portfolio lead and enriched from Act-On's public developer surface.
