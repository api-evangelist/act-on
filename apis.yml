name: Act-On
description: >-
  Act-On Software is a cloud-based marketing automation platform used by B2B and
  B2C marketing teams for email marketing, lead generation and nurturing, landing
  pages and forms, website visitor tracking, lead scoring and segmentation, custom
  data, and campaign reporting. Act-On publishes four OpenAPI 3.1 documents through
  its developer portal covering 158 operations on one gateway host
  (https://api.actonsoftware.com, with an EU region at api-eu.actonsoftware.com):
  the legacy form-encoded /api/1 surface, the newer JSON Act-On Contacts layer at
  /ucl/v2, a transactional email endpoint at /ete/v1, and a separately versioned
  Custom Objects Service at /custom-objects/v1 that is in request-only beta.
  Authentication is OAuth 2.0 with password, refresh_token and authorization_code
  grants and no scopes. Act-On also ships a signed outgoing-webhook event surface
  with nineteen documented event types. Added to the API Evangelist network from a
  Norwest Venture Partners portfolio lead and enriched from Act-On's public
  developer surface.
