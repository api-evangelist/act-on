gaps:
- >-
  Forms and landing pages are readable but not writable over the API — an agent can
  report on them and delete a page, but cannot create one.
- >-
  Automated Programs are effectively opaque: one list operation, no read of steps, no
  trigger, no enrolment.
- >-
  With zero named schemas on act-on-api-1, the entity shapes above are the best
  available reconstruction. Act-On publishes no object reference page.
