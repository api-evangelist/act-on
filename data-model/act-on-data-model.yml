api: Act-On REST API
summary: >-
  Act-On's object graph is derived from path structure, path parameters and response
  examples rather than from named schemas — act-on-api-1 declares ZERO reusable
  component schemas across its 125 operations, so every body is inlined. Only the
  Custom Objects Service (24 operations) publishes named DTOs. Account is the root of
  everything; Contact is the hub; Marketing List, Segment and Custom Object Dataset
  are the three collections a contact can live in, and every asset (message, media,
  form, page) hangs off Account with reports hanging off the asset.
derivation_note: >-
  Relationships below are inferred from REQUIRED PATH PARAMETERS (a child path
  segment under a parent id is a containment edge) and from id fields appearing in
  published response examples. Where a relationship is implied by product behaviour
  but not visible in the contract, it is marked evidence: docs and flagged.
schema_coverage:
  act-on-api-1: {named_schemas: 0, operations: 125, note: 'Everything inlined; response
      schemas are frequently `{"type":"object","properties":{}}` with the real shape
      shown only in an example string. A generated client gets almost no typing.'}
  custom-objects-service: {named_schemas: 12, operations: 24, schemas: [HttpErrorResponse,
      CreateSchemaRequestDTO, FieldDefinitionDTO, RelationshipDefinitionDTO, DataQueryRequestDTO,
      JoinStrategyDTO, PaginationDTO, SortFieldDTO, CreateDatasetRequestDTO, UpdateDatasetRequestDTO,
      ValidationRequestDTO, DeleteRecordsRequestDTO]}
id_conventions:
  style: mixed
  observed_prefixes:
  - {prefix: 'l-', entity: MarketingList, example: l-0001, source: GET /api/1/list response
      example}
  - {prefix: 'p-', entity: LandingPage, example: p-0001, source: response example}
  - {prefix: 'q-', entity: Form, example: q-0002, source: response example}
  note: >-
    Prefixed string ids appear on the /api/1 asset resources. Contacts are addressed
    four different ways — internal id, email address, externalId+objectType, and
    cookieId — and Custom Data uses accountId + objectId + datasetId triples. Act-On
    publishes no id-prefix reference table; the three prefixes above are every one
    that appears in the contract.
